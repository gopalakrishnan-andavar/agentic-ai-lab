[project]
name = "agentic-ai-lab"
version = "0.1.0"
description = "Self-learning lab for agentic AI — RAG and a hand-rolled agent loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ai_lab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E,F = pycodestyle/pyflakes. I = import sorting. N = PEP 8 naming (the camelCase catcher).
# UP = pyupgrade. B = bugbear, which flags the mutable-default-argument trap from section A.
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
